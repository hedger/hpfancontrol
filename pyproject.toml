[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hp-fancontrol"
version = "0.1.1"
description = "Minimal HP server fan control daemon for HP ProLiant chassis"
readme = "README.md"
authors = [
  { name = "HP Fan Control" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32.0",
  "PyYAML>=6.0.1"
]

[project.scripts]
hp-fancontrol = "hpfancontrol.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
